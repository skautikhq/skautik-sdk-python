name: Publish

# Generated. Edit this in skautikhq/skautik-sdk, not here.
on:
    push:
        tags: ["v*"]
    workflow_dispatch:
        inputs:
            dry_run:
                description: Build everything, publish nothing
                type: boolean
                default: true

env:
    DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}

jobs:
    publish:
        runs-on: ubuntu-latest
        environment: release
        permissions:
            # Trusted publishing, so there is no PyPI token stored anywhere.
            id-token: write
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with:
                  python-version: "3.13"

            - run: python -m pip install --upgrade build
            - run: python -m build

            - uses: pypa/gh-action-pypi-publish@release/v1
              if: env.DRY_RUN != 'true'
